<svg width="860" viewBox="0 70 900 360" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .sec  { font-size: 13px; font-weight: 600; fill: #52514e; }
  .w    { font-size: 14px; font-weight: 600; }
  .io   { font-size: 12.5px; font-weight: 600; }
  .lbl  { font-size: 12px; font-weight: 600; }
  .note { font-size: 11.5px; fill: #52514e; }
  .cell { fill: #F8F9FA; stroke: #868E96; stroke-width: 1.8; }
  .res  { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.6; }
  .px   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .ar   { stroke: #898781; stroke-width: 1.8; fill: none; }
  .ax   { stroke: #4C6EF5; stroke-width: 2; fill: none; }
  .ah   { stroke: #E64980; stroke-width: 2; fill: none; }
  .ab   { stroke: #F76707; stroke-width: 2; fill: none; }
  .cx   { fill: #1864AB; } .cf { fill: #C2255C; } .cb { fill: #D9480F; } .c3 { fill: #087F5B; }
</style>
<title>Bidirectional은 같은 입력을 순방향과 역방향 RNN이 각각 읽고, 두 결과를 이어 붙인다</title>
<desc>입력 x₁, x₂, x₃이 위쪽 순방향 RNN과 아래쪽 역방향 RNN에 똑같이 들어간다. 순방향은 x₁부터 x₃ 쪽으로 순환해 x₃ 칸에서 결과를 내고, 역방향은 x₃부터 x₁ 쪽으로 순환해 x₁ 칸에서 결과를 낸다. 두 결과 (N, 10)을 이어 붙여 (N, 20)이 된다.</desc>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- 순방향 -->
<text x="40" y="110" class="sec cf">순방향</text>
<text x="40" y="128" class="note">x₁ → x₃</text>
<rect x="222" y="90" width="76" height="46" rx="6" class="cell"/><text x="260" y="118" text-anchor="middle" class="w">h₁</text>
<rect x="392" y="90" width="76" height="46" rx="6" class="cell"/><text x="430" y="118" text-anchor="middle" class="w">h₂</text>
<rect x="562" y="90" width="76" height="46" rx="6" class="cell"/><text x="600" y="118" text-anchor="middle" class="w">h₃</text>
<path d="M298 113 H 388" class="ah" marker-end="url(#g)"/>
<path d="M468 113 H 558" class="ah" marker-end="url(#g)"/>

<!-- 입력 -->
<text x="40" y="210" class="sec">입력</text>
<rect x="230" y="190" width="60" height="30" rx="5" class="px"/><text x="260" y="210" text-anchor="middle" class="io cx">x₁</text>
<rect x="400" y="190" width="60" height="30" rx="5" class="px"/><text x="430" y="210" text-anchor="middle" class="io cx">x₂</text>
<rect x="570" y="190" width="60" height="30" rx="5" class="px"/><text x="600" y="210" text-anchor="middle" class="io cx">x₃</text>
<path d="M260 190 V 140" class="ax" marker-end="url(#g)"/>
<path d="M430 190 V 140" class="ax" marker-end="url(#g)"/>
<path d="M600 190 V 140" class="ax" marker-end="url(#g)"/>
<path d="M260 220 V 270" class="ax" marker-end="url(#g)"/>
<path d="M430 220 V 270" class="ax" marker-end="url(#g)"/>
<path d="M600 220 V 270" class="ax" marker-end="url(#g)"/>

<!-- 역방향 -->
<text x="40" y="294" class="sec cb">역방향</text>
<text x="40" y="312" class="note">x₃ → x₁</text>
<rect x="222" y="274" width="76" height="46" rx="6" class="cell"/><text x="260" y="302" text-anchor="middle" class="w">h₁'</text>
<rect x="392" y="274" width="76" height="46" rx="6" class="cell"/><text x="430" y="302" text-anchor="middle" class="w">h₂'</text>
<rect x="562" y="274" width="76" height="46" rx="6" class="cell"/><text x="600" y="302" text-anchor="middle" class="w">h₃'</text>
<path d="M562 297 H 472" class="ab" marker-end="url(#g)"/>
<path d="M392 297 H 302" class="ab" marker-end="url(#g)"/>

<!-- 결과 합치기 -->
<path d="M638 113 H 790 V 176" class="ar" marker-end="url(#g)"/>
<text x="660" y="104" class="lbl cf">h₃  (N, 10)</text>
<path d="M222 297 H 180 V 350 H 790 V 234" class="ar" marker-end="url(#g)"/>
<text x="660" y="342" class="lbl cb">h₁'  (N, 10)</text>
<rect x="720" y="180" width="140" height="50" rx="6" class="res"/>
<text x="790" y="201" text-anchor="middle" class="lbl c3">이어 붙임</text>
<text x="790" y="219" text-anchor="middle" class="lbl c3">(N, 20)</text>

<text x="40" y="392" class="note">순방향은 x₃ 칸에서, 역방향은 x₁ 칸에서 끝남. 두 결과 모두 입력 세 칸을 전부 읽은 뒤의 값</text>
<text x="40" y="412" class="note">SimpleRNN(10)이 두 벌이라 출력 10 + 10 = 20, 파라미터 120 × 2 = 240</text>
</svg>
