<svg width="760" viewBox="0 0 800 262" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .title { font-size: 15px; font-weight: 600; }
  .formula { font-size: 15px; font-weight: 600; }
  .calc { font-size: 13px; fill: #52514e; }
  .cell { font-size: 12px; fill: #4C6EF5; }
  .kernel { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 2; }
  .kline { stroke: #4C6EF5; stroke-width: 1; }
  .r { fill: #FFE3E3; stroke: #E03131; stroke-width: 2; }
  .rl { stroke: #E03131; stroke-width: 1; }
  .g { fill: #EBFBEE; stroke: #2F9E44; stroke-width: 2; }
  .gl { stroke: #2F9E44; stroke-width: 1; }
  .b { fill: #E7F5FF; stroke: #1971C2; stroke-width: 2; }
  .bl { stroke: #1971C2; stroke-width: 1; }
  .bias { fill: #FFF4E6; stroke: #F76707; stroke-width: 2; }
  .biast { font-size: 14px; font-weight: 600; fill: #D9480F; }
  .filt { fill: #FFF0F6; stroke: #E64980; stroke-width: 2; }
  .filtt { font-size: 13px; font-weight: 600; fill: #C2255C; }
  .arrow { stroke: #898781; stroke-width: 2; fill: none; }
  .box { fill: #F8F9FA; stroke: #CED4DA; stroke-width: 1; }
  .code { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  .step { font-size: 14px; }
  .hl { font-weight: 600; fill: #C2255C; }
  .sep { stroke: #DEE2E6; stroke-width: 1; }
</style>
<title>Conv2D 파라미터 개수 계산 과정</title>
<desc>커널 한 장 n×n, 입력 채널 c장만큼 n×n×c에 bias b를 더한 것이 필터 하나, 필터 f개면 f×(n×n×c+b)가 되는 과정</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ① 커널 한 장 -->
<text x="110" y="36" text-anchor="middle" class="title">① 커널 한 장</text>
<rect x="68" y="80" width="84" height="84" class="kernel"/>
<line x1="96" y1="80" x2="96" y2="164" class="kline"/>
<line x1="124" y1="80" x2="124" y2="164" class="kline"/>
<line x1="68" y1="108" x2="152" y2="108" class="kline"/>
<line x1="68" y1="136" x2="152" y2="136" class="kline"/>
<text x="82" y="99" text-anchor="middle" class="cell">w</text><text x="110" y="99" text-anchor="middle" class="cell">w</text><text x="138" y="99" text-anchor="middle" class="cell">w</text>
<text x="82" y="127" text-anchor="middle" class="cell">w</text><text x="110" y="127" text-anchor="middle" class="cell">w</text><text x="138" y="127" text-anchor="middle" class="cell">w</text>
<text x="82" y="155" text-anchor="middle" class="cell">w</text><text x="110" y="155" text-anchor="middle" class="cell">w</text><text x="138" y="155" text-anchor="middle" class="cell">w</text>
<text x="110" y="198" text-anchor="middle" class="formula">n × n</text>

<line x1="176" y1="122" x2="236" y2="122" marker-end="url(#arrow)" class="arrow"/>

<!-- ② 입력 채널만큼 + bias -->
<text x="335" y="36" text-anchor="middle" class="title">② 입력 채널만큼 + bias</text>
<text x="310" y="58" text-anchor="middle" class="calc">c장</text>
<rect x="286" y="68" width="72" height="72" class="b"/>
<line x1="310" y1="68" x2="310" y2="140" class="bl"/><line x1="334" y1="68" x2="334" y2="140" class="bl"/>
<line x1="286" y1="92" x2="358" y2="92" class="bl"/><line x1="286" y1="116" x2="358" y2="116" class="bl"/>
<rect x="276" y="78" width="72" height="72" class="g"/>
<line x1="300" y1="78" x2="300" y2="150" class="gl"/><line x1="324" y1="78" x2="324" y2="150" class="gl"/>
<line x1="276" y1="102" x2="348" y2="102" class="gl"/><line x1="276" y1="126" x2="348" y2="126" class="gl"/>
<rect x="266" y="88" width="72" height="72" class="r"/>
<line x1="290" y1="88" x2="290" y2="160" class="rl"/><line x1="314" y1="88" x2="314" y2="160" class="rl"/>
<line x1="266" y1="112" x2="338" y2="112" class="rl"/><line x1="266" y1="136" x2="338" y2="136" class="rl"/>
<text x="376" y="129" text-anchor="middle" class="title">+</text>
<circle cx="408" cy="124" r="17" class="bias"/>
<text x="408" y="129" text-anchor="middle" class="biast">b</text>
<text x="335" y="198" text-anchor="middle" class="formula">n × n × c + b</text>
<text x="335" y="220" text-anchor="middle" class="calc">= 필터 1개</text>
<text x="400" y="244" text-anchor="middle" class="calc">c = 입력 채널 수 : 첫 층은 흑백 1 · 컬러 3,  그 뒤로는 앞 층의 filters 수</text>

<line x1="446" y1="122" x2="506" y2="122" marker-end="url(#arrow)" class="arrow"/>

<!-- ③ 필터 개수만큼 -->
<text x="630" y="36" text-anchor="middle" class="title">③ 필터 개수만큼</text>
<rect x="600" y="68" width="64" height="64" class="filt"/>
<rect x="590" y="78" width="64" height="64" class="filt"/>
<rect x="580" y="88" width="64" height="64" class="filt"/>
<rect x="570" y="98" width="64" height="64" class="filt"/>
<text x="602" y="134" text-anchor="middle" class="filtt">필터</text>
<text x="684" y="80" class="title">× f</text>
<text x="630" y="198" text-anchor="middle" class="formula">f × (n × n × c + b)</text>

</svg>
