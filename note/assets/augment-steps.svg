<title>사진 10장에서 5장을 뽑아 변형한 뒤 원본에 이어붙이는 과정</title>
<desc>번호표를 뽑아 그 번호의 사진을 꺼내고, 변형 기계를 통과시킨 뒤 원본 뒤에 이어붙여 10장이 15장이 된다. 같은 3번이 두 번 뽑혀도 변형이 달라 서로 다른 사진이 된다.</desc>
