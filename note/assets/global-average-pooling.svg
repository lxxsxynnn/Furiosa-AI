0" y2="310.0" class="mapl"/><line x1="85.0" y1="280" x2="85.0" y2="340" class="mapl"/><line x1="40" y1="325.0" x2="100" y2="325.0" class="mapl"/><text x="78" y="362" text-anchor="middle" class="calc">(10, 10, 32)</text><line x1="140" y1="310" x2="190" y2="310" marker-end="url(#arrow)" class="arrow"/><text x="165" y="300" text-anchor="middle" class="small">장마다 평균</text><rect x="200" y="300" width="9" height="20" class="cellG"/><rect x="209" y="300" width="9" height="20" class="cellG"/><rect x="218" y="300" width="9" height="20" class="cellG"/><rect x="227" y="300" width="9" height="20" class="cellG"/><rect x="236" y="300" width="9" height="20" class="cellG"/><rect x="245" y="300" width="9" height="20" class="cellG"/><text x="266" y="315" text-anchor="middle" class="dots">…</text><rect x="278" y="300" width="9" height="20" class="cellG"/><rect x="287" y="300" width="9" height="20" class="cellG"/><text x="248.0" y="340" text-anchor="middle" class="calc">32개 (= 채널 수)</text><line x1="300" y1="310" x2="533" y2="274" class="edge"/><line x1="300" y1="310" x2="533" y2="292" class="edge"/><line x1="300" y1="310" x2="533" y2="310" class="edge"/><line x1="300" y1="310" x2="533" y2="328" class="edge"/><line x1="300" y1="310" x2="533" y2="346" class="edge"/><circle cx="540" cy="274" r="7" class="node"/><circle cx="540" cy="292" r="7" class="node"/><circle cx="540" cy="310" r="7" class="node"/><circle cx="540" cy="328" r="7" class="node"/><circle cx="540" cy="346" r="7" class="node"/><text x="540" y="370" text-anchor="middle" class="calc">Dense(10)</text><text x="572" y="306" class="calc">(32 + 1) × 10</text><text x="572" y="332" class="big-g">= 330</text><line x1="24" y1="386" x2="696" y2="386" class="div"/><text x="24" y="412" class="title2">특징맵 한 장의 평균</text><rect x="24" y="424" width="14" height="14" class="map"/><text x="31.0" y="434" text-anchor="middle" class="num">1</text><rect x="38" y="424" width="14" height="14" class="map"/><text x="45.0" y="434" text-anchor="middle" class="num">2</text><rect x="52" y="424" width="14" height="14" class="map"/><text x="59.0" y="434" text-anchor="middle" class="num">3</text><rect x="66" y="424" width="14" height="14" class="map"/><text x="73.0" y="434" text-anchor="middle" class="num">4</text><rect x="24" y="438" width="14" height="14" class="map"/><text x="31.0" y="448" text-anchor="middle" class="num">5</text><rect x="38" y="438" width="14" height="14" class="map"/><text x="45.0" y="448" text-anchor="middle" class="num">6</text><rect x="52" y="438" width="14" height="14" class="map"/><text x="59.0" y="448" text-anchor="middle" class="num">7</text><rect x="66" y="438" width="14" height="14" class="map"/><text x="73.0" y="448" text-anchor="middle" class="num">8</text><rect x="24" y="452" width="14" height="14" class="map"/><text x="31.0" y="462" text-anchor="middle" class="num">9</text><rect x="38" y="452" width="14" height="14" class="map"/><text x="45.0" y="462" text-anchor="middle" class="num">10</text><rect x="52" y="452" width="14" height="14" class="map"/><text x="59.0" y="462" text-anchor="middle" class="num">11</text><rect x="66" y="452" width="14" height="14" class="map"/><text x="73.0" y="462" text-anchor="middle" class="num">12</text><rect x="24" y="466" width="14" height="14" class="map"/><text x="31.0" y="476" text-anchor="middle" class="num">13</text><rect x="38" y="466" width="14" height="14" class="map"/><text x="45.0" y="476" text-anchor="middle" class="num">14</text><rect x="52" y="466" width="14" height="14" class="map"/><text x="59.0" y="476" text-anchor="middle" class="num">15</text><rect x="66" y="466" width="14" height="14" class="map"/><text x="73.0" y="476" text-anchor="middle" class="num">16</text><line x1="96" y1="452" x2="140" y2="452" marker-end="url(#arrow)" class="arrow"/><rect x="150" y="440" width="40" height="24" class="cellG"/><text x="170" y="457" text-anchor="middle" class="val">8.5</text><text x="204" y="448" class="calc">(1 + 2 + … + 16) / 16 = 8.5</text><text x="204" y="468" class="sub">16개 값이 1개로 → 채널 32장이면 값 32개</text>
