<title>Flatten과 GlobalAveragePooling2D 비교</title>
<desc>(10, 10, 32) 출력을 Flatten하면 값 3,200개가 되어 Dense(10) 파라미터가 32,010개, GlobalAveragePooling2D는 특징맵 한 장마다 평균 1개로 값 32개가 되어 330개. 아래에 4×4 특징맵 1~16의 평균이 8.5가 되는 예시</desc>
