<svg width="860" viewBox="0 0 900 700" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .sec  { font-size: 13px; font-weight: 600; fill: #52514e; }
  .w    { font-size: 14px; font-weight: 600; }
  .lbl  { font-size: 12px; font-weight: 600; }
  .val  { font-size: 12px; font-weight: 600; }
  .note { font-size: 11.5px; fill: #52514e; }
  .cell { fill: #F8F9FA; stroke: #868E96; stroke-width: 1.8; }
  .nd   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .ln   { stroke: #adb5bd; stroke-width: 1.2; }
  .ah   { stroke: #E64980; stroke-width: 2; fill: none; }
  .ay   { stroke: #0CA678; stroke-width: 2; fill: none; }
  .ring { fill: none; stroke: #0CA678; stroke-width: 2.2; stroke-dasharray: 5 3; }
  .hit  { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.5; }
  .zero { fill: #F1F3F5; stroke: #ced4da; stroke-width: 1.2; }
  .cy2  { fill: #087F5B; } .zt { fill: #adb5bd; }
</style>
<title>한 칸 안에서는 Dense처럼 전부 연결되지만, 칸 사이에는 앞에서 뒤로만 전달된다</title>
<desc>Dense는 아래 노드 셋이 위 노드 셋 전부와 이어져 연결이 아홉 개다. RNN을 쌓으면 같은 칸끼리만 세로로 직접 이어지고, 앞 칸은 2층의 가로 순환을 거쳐 뒤 칸 계산에까지 반영된다. 입력 하나를 바꿔 측정하면 앞 입력일수록 영향 범위가 넓고, 뒤 입력은 이미 지나간 칸에 영향을 주지 못해 삼각형 모양이 된다.</desc>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="40" y="44" class="sec">Dense — 아래 노드 전부가 위 노드 전부에</text>
<line x1="330" y1="147" x2="330" y2="107" class="ln"/>
<line x1="330" y1="147" x2="450" y2="107" class="ln"/>
<line x1="330" y1="147" x2="570" y2="107" class="ln"/>
<line x1="450" y1="147" x2="330" y2="107" class="ln"/>
<line x1="450" y1="147" x2="450" y2="107" class="ln"/>
<line x1="450" y1="147" x2="570" y2="107" class="ln"/>
<line x1="570" y1="147" x2="330" y2="107" class="ln"/>
<line x1="570" y1="147" x2="450" y2="107" class="ln"/>
<line x1="570" y1="147" x2="570" y2="107" class="ln"/>
<circle cx="330" cy="90" r="17" class="nd"/>
<circle cx="330" cy="164" r="17" class="nd"/>
<circle cx="450" cy="90" r="17" class="nd"/>
<circle cx="450" cy="164" r="17" class="nd"/>
<circle cx="570" cy="90" r="17" class="nd"/>
<circle cx="570" cy="164" r="17" class="nd"/>
<text x="300" y="95" text-anchor="end" class="lbl">출력</text>
<text x="300" y="169" text-anchor="end" class="lbl">입력</text>
<text x="40" y="200" class="note">연결이 9개. 빠지는 칸 없이 꽉 참</text>
<line x1="40" y1="224" x2="860" y2="224" stroke="#d6d4cf" stroke-width="1"/>
<text x="40" y="252" class="sec">RNN 쌓기 — 같은 칸끼리만 직접 연결, 뒤 칸에는 가로를 타고 감</text>
<rect x="305" y="280" width="70" height="40" rx="6" class="cell"/>
<rect x="455" y="280" width="70" height="40" rx="6" class="cell"/>
<rect x="605" y="280" width="70" height="40" rx="6" class="cell"/>
<path d="M375 300 H 451" class="ah" marker-end="url(#g)"/>
<path d="M525 300 H 601" class="ah" marker-end="url(#g)"/>
<rect x="305" y="370" width="70" height="40" rx="6" class="cell"/>
<rect x="455" y="370" width="70" height="40" rx="6" class="cell"/>
<rect x="605" y="370" width="70" height="40" rx="6" class="cell"/>
<path d="M375 390 H 451" class="ah" marker-end="url(#g)"/>
<path d="M525 390 H 601" class="ah" marker-end="url(#g)"/>
<text x="340" y="305" text-anchor="middle" class="w">h₁</text>
<text x="340" y="395" text-anchor="middle" class="w">h₁</text>
<path d="M340 370 V 324" class="ay" marker-end="url(#g)"/>
<text x="490" y="305" text-anchor="middle" class="w">h₂</text>
<text x="490" y="395" text-anchor="middle" class="w">h₂</text>
<path d="M490 370 V 324" class="ay" marker-end="url(#g)"/>
<text x="640" y="305" text-anchor="middle" class="w">h₃</text>
<text x="640" y="395" text-anchor="middle" class="w">h₃</text>
<path d="M640 370 V 324" class="ay" marker-end="url(#g)"/>
<text x="296" y="305" text-anchor="end" class="lbl">2층</text>
<text x="296" y="395" text-anchor="end" class="lbl">1층</text>
<circle cx="340" cy="390" r="26" class="ring"/>
<text x="40" y="432" class="note">1층 h₁(동그라미)은 세로로 2층 h₁에, 2층 h₁을 거쳐 h₂와 h₃ 계산에도 반영됨</text>
<text x="40" y="450" class="note">반대로 1층 h₃은 이미 계산이 끝난 2층 h₁, h₂에는 반영되지 않음</text>
<line x1="40" y1="474" x2="860" y2="474" stroke="#d6d4cf" stroke-width="1"/>
<text x="40" y="502" class="sec">입력 하나를 바꿨을 때 2층 칸별 변화량 (실측)</text>
<text x="415" y="528" text-anchor="middle" class="lbl">2층 h₁</text>
<text x="535" y="528" text-anchor="middle" class="lbl">2층 h₂</text>
<text x="655" y="528" text-anchor="middle" class="lbl">2층 h₃</text>
<text x="350" y="560" text-anchor="end" class="lbl">x₁만 바꿈</text>
<rect x="360" y="538" width="110" height="34" rx="5" class="hit"/><text x="415" y="560" text-anchor="middle" class="val cy2">0.1303</text>
<rect x="480" y="538" width="110" height="34" rx="5" class="hit"/><text x="535" y="560" text-anchor="middle" class="val cy2">0.1715</text>
<rect x="600" y="538" width="110" height="34" rx="5" class="hit"/><text x="655" y="560" text-anchor="middle" class="val cy2">0.1836</text>
<text x="350" y="600" text-anchor="end" class="lbl">x₂만 바꿈</text>
<rect x="360" y="578" width="110" height="34" rx="5" class="zero"/><text x="415" y="600" text-anchor="middle" class="val zt">0</text>
<rect x="480" y="578" width="110" height="34" rx="5" class="hit"/><text x="535" y="600" text-anchor="middle" class="val cy2">0.1290</text>
<rect x="600" y="578" width="110" height="34" rx="5" class="hit"/><text x="655" y="600" text-anchor="middle" class="val cy2">0.1571</text>
<text x="350" y="640" text-anchor="end" class="lbl">x₃만 바꿈</text>
<rect x="360" y="618" width="110" height="34" rx="5" class="zero"/><text x="415" y="640" text-anchor="middle" class="val zt">0</text>
<rect x="480" y="618" width="110" height="34" rx="5" class="zero"/><text x="535" y="640" text-anchor="middle" class="val zt">0</text>
<rect x="600" y="618" width="110" height="34" rx="5" class="hit"/><text x="655" y="640" text-anchor="middle" class="val cy2">0.1151</text>
<text x="40" y="676" class="note">0이 찍힌 자리는 반영되지 않는 경로. 꽉 찬 사각형이 아니라 삼각형이 됨</text>
</svg>
