<svg width="680" viewBox="0 0 720 340" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .title { font-size: 15px; font-weight: 600; }
  .shape { font-size: 15px; font-weight: 600; }
  .calc  { font-size: 13px; fill: #52514e; }
  .note  { font-size: 13px; fill: #52514e; }
  .in    { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 2; }
  .l1    { fill: #FFF0F6; stroke: #E64980; stroke-width: 2; }
  .l2    { fill: #FFF4E6; stroke: #F76707; stroke-width: 2; }
  .p1    { font-size: 13px; font-weight: 600; fill: #C2255C; }
  .p2    { font-size: 13px; font-weight: 600; fill: #D9480F; }
  .hit   { fill: #1a1a1a; fill-opacity: 0.25; stroke: #1a1a1a; stroke-width: 2; }
  .arrow { stroke: #898781; stroke-width: 2; fill: none; }
</style>
<title>keras36_cnn1 Conv2D 층별 shape 변화</title>
<desc>10×10×1 흑백 이미지가 3×3 필터 10개를 지나 8×8×10, 다시 2×2 필터 5개를 지나 7×7×5가 되는 과정과 층별 파라미터 개수 100, 205를 나타낸 다이어그램</desc>
<defs>
<pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#1a1a1a" stroke-opacity="0.18" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- 1. 입력 (10, 10, 1) -->
<text x="96" y="40" text-anchor="middle" class="title">입력</text>
<rect x="36" y="84" width="120" height="120" class="in"/>
<rect x="36" y="84" width="120" height="120" fill="url(#grid)"/>
<rect x="36" y="84" width="36" height="36" class="hit"/>
<text x="96" y="232" text-anchor="middle" class="shape">(10, 10, 1)</text>
<text x="96" y="252" text-anchor="middle" class="calc">흑백 10×10 한 장</text>

<line x1="172" y1="144" x2="250" y2="144" marker-end="url(#arrow)" class="arrow"/>
<text x="211" y="132" text-anchor="middle" class="note">3×3 필터 10개</text>
<text x="211" y="164" text-anchor="middle" class="note">3×3 → 1칸</text>

<!-- 2. Conv2D(10, (3, 3)) → (8, 8, 10) -->
<text x="324" y="40" text-anchor="middle" class="title">Conv2D(10, (3, 3))</text>
<rect x="300" y="84" width="96" height="96" class="l1"/>
<rect x="292" y="92" width="96" height="96" class="l1"/>
<rect x="284" y="100" width="96" height="96" class="l1"/>
<rect x="276" y="108" width="96" height="96" class="l1"/>
<rect x="276" y="108" width="96" height="96" fill="url(#grid)"/>
<rect x="276" y="108" width="12" height="12" class="hit"/>
<text x="402" y="92" class="shape">×10</text>
<text x="324" y="232" text-anchor="middle" class="shape">(8, 8, 10)</text>
<text x="324" y="252" text-anchor="middle" class="calc">10 - 3 + 1 = 8</text>
<text x="324" y="284" text-anchor="middle" class="p1">(3×3×1 + 1) × 10 = 100</text>

<line x1="428" y1="144" x2="508" y2="144" marker-end="url(#arrow)" class="arrow"/>
<text x="468" y="132" text-anchor="middle" class="note">2×2 필터 5개</text>
<text x="468" y="164" text-anchor="middle" class="note">채널 10장을 함께 봄</text>

<!-- 3. Conv2D(5, (2, 2)) → (7, 7, 5) -->
<text x="588" y="40" text-anchor="middle" class="title">Conv2D(5, (2, 2))</text>
<rect x="556" y="104" width="84" height="84" class="l2"/>
<rect x="548" y="112" width="84" height="84" class="l2"/>
<rect x="540" y="120" width="84" height="84" class="l2"/>
<rect x="540" y="120" width="84" height="84" fill="url(#grid)"/>
<text x="646" y="112" class="shape">×5</text>
<text x="588" y="232" text-anchor="middle" class="shape">(7, 7, 5)</text>
<text x="588" y="252" text-anchor="middle" class="calc">8 - 2 + 1 = 7</text>
<text x="588" y="284" text-anchor="middle" class="p2">(2×2×10 + 1) × 5 = 205</text>

<text x="360" y="322" text-anchor="middle" class="shape">Total params: 100 + 205 = 305</text>
</svg>
