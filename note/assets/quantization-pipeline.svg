<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7ea6"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="15" font-weight="600" fill="#1a1a1a">변환은 형식만 바꾸고, 양자화에서 비트 수가 줄어듦</text>

  <!-- box 1 : 원본 -->
  <rect x="24" y="56" width="168" height="78" rx="6" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="108" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">원본</text>
  <text x="108" y="102" font-size="11.5" text-anchor="middle" fill="#555555">safetensors 여러 개</text>
  <text x="108" y="121" font-size="12" font-weight="600" text-anchor="middle" fill="#444444">7.6 GB</text>

  <!-- arrow 1 -->
  <line x1="196" y1="95" x2="252" y2="95" stroke="#5b7ea6" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="224" y="84" font-size="11" text-anchor="middle" fill="#5b7ea6">변환</text>

  <!-- box 2 : bf16 gguf -->
  <rect x="256" y="56" width="168" height="78" rx="6" fill="#eef2f7" stroke="#5b7ea6" stroke-width="1.4"/>
  <text x="340" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">BF16 GGUF</text>
  <text x="340" y="102" font-size="11.5" text-anchor="middle" fill="#555555">파일 하나로 합쳐짐</text>
  <text x="340" y="121" font-size="12" font-weight="600" text-anchor="middle" fill="#444444">7.5 GB</text>

  <!-- arrow 2 -->
  <line x1="428" y1="95" x2="484" y2="95" stroke="#5b7ea6" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="456" y="84" font-size="11" text-anchor="middle" fill="#5b7ea6">양자화</text>

  <!-- box 3 : q4 -->
  <rect x="488" y="56" width="168" height="78" rx="6" fill="#cfe0d2" stroke="#4e7a58" stroke-width="1.5"/>
  <text x="572" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">Q4_K_M GGUF</text>
  <text x="572" y="102" font-size="11.5" text-anchor="middle" fill="#555555">비트 수를 줄임</text>
  <text x="572" y="121" font-size="12" font-weight="600" text-anchor="middle" fill="#444444">2.5 GB</text>

  <!-- arrow 3 -->
  <line x1="660" y1="95" x2="716" y2="95" stroke="#5b7ea6" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="688" y="84" font-size="11" text-anchor="middle" fill="#5b7ea6">등록</text>

  <!-- box 4 : ollama -->
  <rect x="720" y="56" width="116" height="78" rx="6" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="778" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">ollama</text>
  <text x="778" y="102" font-size="11.5" text-anchor="middle" fill="#555555">복사본</text>
  <text x="778" y="121" font-size="11.5" text-anchor="middle" fill="#777777">용량 한 벌 더</text>

  <!-- commands -->
  <text x="24" y="178" font-size="11.5" fill="#777777">쓰는 도구</text>
  <line x1="24" y1="188" x2="836" y2="188" stroke="#e2e2e2" stroke-width="1"/>

  <text x="108" y="212" font-size="11" text-anchor="middle" fill="#444444">hf download</text>
  <text x="340" y="212" font-size="11" text-anchor="middle" fill="#444444">convert_hf_to_gguf.py</text>
  <text x="572" y="212" font-size="11" text-anchor="middle" fill="#444444">llama-quantize</text>
  <text x="778" y="212" font-size="11" text-anchor="middle" fill="#444444">ollama create</text>

  <line x1="24" y1="236" x2="836" y2="236" stroke="#e2e2e2" stroke-width="1"/>

  <text x="24" y="262" font-size="12.5" fill="#444444">7.6 → 7.5 GB는 거의 그대로고, 7.5 → 2.5 GB에서 줄어듦. 두 단계가 서로 다른 일을 한다는 표시</text>
  <text x="24" y="286" font-size="12.5" fill="#444444">변환 스크립트는 단순한 자료형만 받고, 블록마다 기준값을 두는 K-quant는 llama-quantize만 할 줄 앎</text>
  <text x="24" y="310" font-size="12.5" fill="#777777">크기는 Qwen3-4B 기준</text>
</svg>
