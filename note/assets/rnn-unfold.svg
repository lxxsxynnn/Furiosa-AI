<svg width="860" viewBox="0 0 900 720" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .sec  { font-size: 13px; font-weight: 600; fill: #52514e; }
  .w    { font-size: 14px; font-weight: 600; }
  .io   { font-size: 12.5px; font-weight: 600; }
  .sml  { font-size: 11px; font-weight: 600; }
  .val  { font-size: 11.5px; font-weight: 600; }
  .note { font-size: 11.5px; fill: #52514e; }
  .cell { fill: #F8F9FA; stroke: #868E96; stroke-width: 1.8; }
  .ar   { stroke: #898781; stroke-width: 1.8; fill: none; }
  .ax   { stroke: #4C6EF5; stroke-width: 2; fill: none; }
  .ah   { stroke: #E64980; stroke-width: 2; fill: none; }
  .px   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .ph   { fill: #FFF0F6; stroke: #E64980; stroke-width: 1.6; }
  .cx   { fill: #1864AB; } .ch { fill: #C2255C; }
  .t3   { fill: #0CA678; } .t2 { fill: #F76707; } .t1 { fill: #4C6EF5; }
  .b3   { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.6; }
  .b2   { fill: #FFF4E6; stroke: #F76707; stroke-width: 1.6; }
  .b1   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
</style>
<title>펼친 칸마다 같은 가중치 두 벌을 다시 쓰고, 옛날 입력일수록 순환 가중치가 더 곱해진다</title>
<desc>세로 화살표 세 개는 모두 같은 입력 가중치이고 가로 화살표 두 개는 모두 같은 순환 가중치다. 마지막 입력은 입력 가중치만 거치고, 그 앞 입력은 순환 가중치를 한 번, 첫 입력은 두 번 더 거친다.</desc>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ── A. 체인 ── -->
<text x="40" y="44" class="sec">칸마다 같은 가중치 두 벌을 다시 씀</text>

<rect x="250" y="118" width="80" height="50" rx="6" class="cell"/><text x="290" y="148" text-anchor="middle" class="w">h₁</text>
<rect x="430" y="118" width="80" height="50" rx="6" class="cell"/><text x="470" y="148" text-anchor="middle" class="w">h₂</text>
<rect x="610" y="118" width="80" height="50" rx="6" class="cell"/><text x="650" y="148" text-anchor="middle" class="w">h₃</text>

<path d="M330 143 H 426" class="ah" marker-end="url(#g)"/>
<text x="378" y="134" text-anchor="middle" class="sml ch">순환 가중치</text>
<path d="M510 143 H 606" class="ah" marker-end="url(#g)"/>
<text x="558" y="134" text-anchor="middle" class="sml ch">순환 가중치</text>
<path d="M690 143 H 758" class="ar" marker-end="url(#g)"/>
<text x="770" y="148" class="io">출력</text>

<path d="M290 214 V 174" class="ax" marker-end="url(#g)"/>
<path d="M470 214 V 174" class="ax" marker-end="url(#g)"/>
<path d="M650 214 V 174" class="ax" marker-end="url(#g)"/>
<text x="298" y="198" class="sml cx">입력 가중치</text>
<text x="478" y="198" class="sml cx">입력 가중치</text>
<text x="658" y="198" class="sml cx">입력 가중치</text>

<text x="290" y="236" text-anchor="middle" class="io t1">나는</text>
<text x="470" y="236" text-anchor="middle" class="io t2">밥을</text>
<text x="650" y="236" text-anchor="middle" class="io t3">먹었다</text>

<text x="40" y="266" class="note">세로 화살표 세 개는 전부 같은 입력 가중치, 가로 화살표 두 개는 전부 같은 순환 가중치. 칸마다 새로 만들지 않음</text>

<line x1="40" y1="288" x2="860" y2="288" stroke="#d6d4cf" stroke-width="1"/>

<!-- ── B. 경로별 가중치 ── -->
<text x="40" y="314" class="sec">입력마다 출력까지 거치는 가중치</text>

<text x="158" y="352" text-anchor="end" class="io t3">먹었다</text>
<rect x="170" y="336" width="104" height="24" rx="12" class="px"/><text x="222" y="352" text-anchor="middle" class="sml cx">입력 가중치</text>
<text x="286" y="352" class="note">→ 출력</text>
<text x="640" y="352" class="val t3">순환 가중치 0번</text>

<text x="158" y="394" text-anchor="end" class="io t2">밥을</text>
<rect x="170" y="378" width="104" height="24" rx="12" class="px"/><text x="222" y="394" text-anchor="middle" class="sml cx">입력 가중치</text>
<rect x="282" y="378" width="104" height="24" rx="12" class="ph"/><text x="334" y="394" text-anchor="middle" class="sml ch">순환 가중치</text>
<text x="398" y="394" class="note">→ 출력</text>
<text x="640" y="394" class="val t2">순환 가중치 1번</text>

<text x="158" y="436" text-anchor="end" class="io t1">나는</text>
<rect x="170" y="420" width="104" height="24" rx="12" class="px"/><text x="222" y="436" text-anchor="middle" class="sml cx">입력 가중치</text>
<rect x="282" y="420" width="104" height="24" rx="12" class="ph"/><text x="334" y="436" text-anchor="middle" class="sml ch">순환 가중치</text>
<rect x="394" y="420" width="104" height="24" rx="12" class="ph"/><text x="446" y="436" text-anchor="middle" class="sml ch">순환 가중치</text>
<text x="510" y="436" class="note">→ 출력</text>
<text x="640" y="436" class="val t1">순환 가중치 2번</text>

<line x1="40" y1="462" x2="860" y2="462" stroke="#d6d4cf" stroke-width="1"/>

<!-- ── C. 효과 ── -->
<text x="40" y="488" class="sec">순환 가중치 크기에 따라 앞 입력의 영향이 달라짐</text>

<text x="60" y="522" class="sec">순환 가중치 = 0.5</text>
<rect x="60"  y="622" width="40" height="8"  class="b1"/>
<rect x="120" y="614" width="40" height="16" class="b2"/>
<rect x="180" y="598" width="40" height="32" class="b3"/>
<text x="80"  y="616" text-anchor="middle" class="val t1">0.25</text>
<text x="140" y="608" text-anchor="middle" class="val t2">0.5</text>
<text x="200" y="592" text-anchor="middle" class="val t3">1.0</text>
<line x1="60" y1="630" x2="220" y2="630" stroke="#b5b2ac" stroke-width="1"/>
<text x="80"  y="648" text-anchor="middle" class="note">나는</text>
<text x="140" y="648" text-anchor="middle" class="note">밥을</text>
<text x="200" y="648" text-anchor="middle" class="note">먹었다</text>
<text x="60"  y="672" class="note">옛날 것일수록 작아짐</text>

<text x="480" y="522" class="sec">순환 가중치 = 1.5</text>
<rect x="480" y="598" width="40" height="32" class="b1"/>
<rect x="540" y="582" width="40" height="48" class="b2"/>
<rect x="600" y="558" width="40" height="72" class="b3"/>
<text x="500" y="592" text-anchor="middle" class="val t1">1.0</text>
<text x="560" y="576" text-anchor="middle" class="val t2">1.5</text>
<text x="620" y="552" text-anchor="middle" class="val t3">2.25</text>
<line x1="480" y1="630" x2="640" y2="630" stroke="#b5b2ac" stroke-width="1"/>
<text x="500" y="648" text-anchor="middle" class="note">나는</text>
<text x="560" y="648" text-anchor="middle" class="note">밥을</text>
<text x="620" y="648" text-anchor="middle" class="note">먹었다</text>
<text x="480" y="672" class="note">옛날 것일수록 커짐</text>

<text x="40" y="700" class="note">timesteps가 30이면 첫 입력은 순환 가중치를 29번 거침. 0.5²⁹은 0.0000000019, 1.5²⁹은 약 127,000</text>
</svg>
