<svg width="860" viewBox="0 0 900 876" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .sec  { font-size: 13px; font-weight: 600; fill: #52514e; }
  .w    { font-size: 14px; font-weight: 600; }
  .io   { font-size: 12.5px; font-weight: 600; }
  .sml  { font-size: 11px; font-weight: 600; }
  .val  { font-size: 11.5px; font-weight: 600; }
  .note { font-size: 11.5px; fill: #52514e; }
  .cell { fill: #F8F9FA; stroke: #868E96; stroke-width: 1.8; }
  .ar   { stroke: #898781; stroke-width: 1.8; fill: none; }
  .ax   { stroke: #4C6EF5; stroke-width: 2; fill: none; }
  .ah   { stroke: #E64980; stroke-width: 2; fill: none; }
  .ay   { stroke: #0CA678; stroke-width: 2; fill: none; }
  .brk  { stroke: #b5b2ac; stroke-width: 1.4; fill: none; }
  .px   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .ph   { fill: #FFF0F6; stroke: #E64980; stroke-width: 1.6; }
  .xc   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.7; }
  .yc   { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.7; }
  .hc   { fill: #F3F0F7; stroke: #7048E8; stroke-width: 1.7; }
  .cx   { fill: #1864AB; } .ch { fill: #C2255C; } .cy2 { fill: #087F5B; }
  .t3   { fill: #0CA678; } .t2 { fill: #F76707; } .t1 { fill: #4C6EF5; }
  .b3   { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.6; }
  .b2   { fill: #FFF4E6; stroke: #F76707; stroke-width: 1.6; }
  .b1   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
</style>
<title>펼친 칸마다 같은 가중치 두 벌을 다시 쓰고, 옛날 입력일수록 순환 가중치가 더 곱해진다</title>
<desc>입력 x가 아래에서 각 칸으로 올라가고, 칸끼리는 가로로 이어지며, 칸마다 y가 위로 나온다. 세로 화살표는 모두 같은 입력 가중치이고 가로 화살표는 모두 같은 순환 가중치다. 마지막 입력은 입력 가중치만 거치고, 그 앞 입력은 순환 가중치를 한 번, 첫 입력은 두 번 더 거친다.</desc>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ── A. 체인 ── -->
<text x="40" y="44" class="sec">칸마다 같은 가중치 두 벌을 다시 씀</text>

<text x="450" y="76" text-anchor="middle" class="io cy2">출력</text>
<path d="M250 116 V 90 H 650 V 116" class="brk"/>
<path d="M450 90 V 116" class="brk"/>

<circle cx="250" cy="138" r="22" class="yc"/><text x="250" y="143" text-anchor="middle" class="w">y₁</text>
<circle cx="450" cy="138" r="22" class="yc"/><text x="450" y="143" text-anchor="middle" class="w">y₂</text>
<circle cx="650" cy="138" r="22" class="yc"/><text x="650" y="143" text-anchor="middle" class="w">y₃</text>

<path d="M250 196 V 164" class="ay" marker-end="url(#g)"/>
<path d="M450 196 V 164" class="ay" marker-end="url(#g)"/>
<path d="M650 196 V 164" class="ay" marker-end="url(#g)"/>

<circle cx="100" cy="223" r="26" class="hc"/><text x="100" y="228" text-anchor="middle" class="w">h₀</text>
<text x="100" y="270" text-anchor="middle" class="note">0으로 시작</text>
<path d="M126 223 H 208" class="ar" marker-end="url(#g)"/>

<rect x="212" y="196" width="76" height="54" rx="6" class="cell"/><text x="250" y="228" text-anchor="middle" class="w">h₁</text>
<rect x="412" y="196" width="76" height="54" rx="6" class="cell"/><text x="450" y="228" text-anchor="middle" class="w">h₂</text>
<rect x="612" y="196" width="76" height="54" rx="6" class="cell"/><text x="650" y="228" text-anchor="middle" class="w">h₃</text>

<path d="M288 223 H 408" class="ah" marker-end="url(#g)"/>
<text x="348" y="214" text-anchor="middle" class="sml ch">순환 가중치</text>
<path d="M488 223 H 608" class="ah" marker-end="url(#g)"/>
<text x="548" y="214" text-anchor="middle" class="sml ch">순환 가중치</text>

<path d="M250 290 V 254" class="ax" marker-end="url(#g)"/>
<path d="M450 290 V 254" class="ax" marker-end="url(#g)"/>
<path d="M650 290 V 254" class="ax" marker-end="url(#g)"/>
<text x="260" y="276" class="sml cx">입력 가중치</text>
<text x="460" y="276" class="sml cx">입력 가중치</text>
<text x="660" y="276" class="sml cx">입력 가중치</text>

<ellipse cx="250" cy="314" rx="34" ry="24" class="xc"/><text x="250" y="319" text-anchor="middle" class="io t1">나는</text>
<ellipse cx="450" cy="314" rx="34" ry="24" class="xc"/><text x="450" y="319" text-anchor="middle" class="io t2">밥을</text>
<ellipse cx="650" cy="314" rx="34" ry="24" class="xc"/><text x="650" y="319" text-anchor="middle" class="io t3">먹었다</text>

<path d="M250 338 V 366 H 650 V 338" class="brk"/>
<path d="M450 366 V 338" class="brk"/>
<text x="450" y="386" text-anchor="middle" class="io cx">입력</text>

<text x="40" y="414" class="note">세로 화살표 세 개는 전부 같은 입력 가중치, 가로 화살표 두 개는 전부 같은 순환 가중치. 칸마다 새로 만들지 않음</text>
<text x="40" y="432" class="note">칸마다 y가 나오지만 기본 설정에서는 마지막 y₃만 다음 층으로 감</text>

<line x1="40" y1="456" x2="860" y2="456" stroke="#d6d4cf" stroke-width="1"/>

<!-- ── B. 경로별 가중치 ── -->
<text x="40" y="482" class="sec">입력마다 출력까지 거치는 가중치</text>

<text x="158" y="520" text-anchor="end" class="io t3">먹었다</text>
<rect x="170" y="504" width="104" height="24" rx="12" class="px"/><text x="222" y="520" text-anchor="middle" class="sml cx">입력 가중치</text>
<text x="286" y="520" class="note">→ 출력</text>
<text x="640" y="520" class="val t3">순환 가중치 0번</text>

<text x="158" y="562" text-anchor="end" class="io t2">밥을</text>
<rect x="170" y="546" width="104" height="24" rx="12" class="px"/><text x="222" y="562" text-anchor="middle" class="sml cx">입력 가중치</text>
<rect x="282" y="546" width="104" height="24" rx="12" class="ph"/><text x="334" y="562" text-anchor="middle" class="sml ch">순환 가중치</text>
<text x="398" y="562" class="note">→ 출력</text>
<text x="640" y="562" class="val t2">순환 가중치 1번</text>

<text x="158" y="604" text-anchor="end" class="io t1">나는</text>
<rect x="170" y="588" width="104" height="24" rx="12" class="px"/><text x="222" y="604" text-anchor="middle" class="sml cx">입력 가중치</text>
<rect x="282" y="588" width="104" height="24" rx="12" class="ph"/><text x="334" y="604" text-anchor="middle" class="sml ch">순환 가중치</text>
<rect x="394" y="588" width="104" height="24" rx="12" class="ph"/><text x="446" y="604" text-anchor="middle" class="sml ch">순환 가중치</text>
<text x="510" y="604" class="note">→ 출력</text>
<text x="640" y="604" class="val t1">순환 가중치 2번</text>

<line x1="40" y1="630" x2="860" y2="630" stroke="#d6d4cf" stroke-width="1"/>

<!-- ── C. 효과 ── -->
<text x="40" y="656" class="sec">순환 가중치 크기에 따라 앞 입력의 영향이 달라짐</text>

<text x="60" y="690" class="sec">순환 가중치 = 0.5</text>
<rect x="60"  y="790" width="40" height="8"  class="b1"/>
<rect x="120" y="782" width="40" height="16" class="b2"/>
<rect x="180" y="766" width="40" height="32" class="b3"/>
<text x="80"  y="784" text-anchor="middle" class="val t1">0.25</text>
<text x="140" y="776" text-anchor="middle" class="val t2">0.5</text>
<text x="200" y="760" text-anchor="middle" class="val t3">1.0</text>
<line x1="60" y1="798" x2="220" y2="798" stroke="#b5b2ac" stroke-width="1"/>
<text x="80"  y="816" text-anchor="middle" class="note">나는</text>
<text x="140" y="816" text-anchor="middle" class="note">밥을</text>
<text x="200" y="816" text-anchor="middle" class="note">먹었다</text>
<text x="60"  y="840" class="note">옛날 것일수록 작아짐</text>

<text x="480" y="690" class="sec">순환 가중치 = 1.5</text>
<rect x="480" y="766" width="40" height="32" class="b1"/>
<rect x="540" y="750" width="40" height="48" class="b2"/>
<rect x="600" y="726" width="40" height="72" class="b3"/>
<text x="500" y="760" text-anchor="middle" class="val t1">1.0</text>
<text x="560" y="744" text-anchor="middle" class="val t2">1.5</text>
<text x="620" y="720" text-anchor="middle" class="val t3">2.25</text>
<line x1="480" y1="798" x2="640" y2="798" stroke="#b5b2ac" stroke-width="1"/>
<text x="500" y="816" text-anchor="middle" class="note">나는</text>
<text x="560" y="816" text-anchor="middle" class="note">밥을</text>
<text x="620" y="816" text-anchor="middle" class="note">먹었다</text>
<text x="480" y="840" class="note">옛날 것일수록 커짐</text>

<text x="40" y="868" class="note">timesteps가 30이면 첫 입력은 순환 가중치를 29번 거침. 0.5²⁹은 0.0000000019, 1.5²⁹은 약 127,000</text>
</svg>
