<svg width="860" viewBox="0 50 900 340" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .sec  { font-size: 13px; font-weight: 600; fill: #52514e; }
  .w    { font-size: 14px; font-weight: 600; }
  .io   { font-size: 12.5px; font-weight: 600; }
  .lbl  { font-size: 12px; font-weight: 600; }
  .sml  { font-size: 10.5px; font-weight: 600; fill: #52514e; }
  .note { font-size: 11.5px; fill: #52514e; }
  .mono { font-family: Consolas, "JetBrains Mono", monospace; }
  .pad  { fill: #F1F3F5; stroke: #ADB5BD; stroke-width: 1.4; stroke-dasharray: 4 3; }
  .px   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .ar   { stroke: #898781; stroke-width: 1.6; fill: none; }
  .ah   { stroke: #E64980; stroke-width: 2; fill: none; }
  .axis { stroke: #868E96; stroke-width: 1.2; fill: none; }
  .grid { stroke: #CED4DA; stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
  .cb { fill: #3B5BDB; } .cg { fill: #0C8599; } .co { fill: #D9480F; } .c3 { fill: #087F5B; }
</style>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<title>코사인 유사도는 두 벡터 사이 각도로 유사한 정도를 잰다</title>
<desc>2차원 평면에 고양이 (0.8, 0.6), 강아지 (0.7, 0.7), 자동차 (-0.2, 0.9) 벡터를 그렸다. 고양이와 강아지 사이 각도는 8도로 코사인 유사도 0.99, 고양이와 자동차 사이 각도는 66도로 0.41이다.</desc>
<path d="M60 360 H 470" class="axis" marker-end="url(#g)"/>
<path d="M170 374 V 70" class="axis" marker-end="url(#g)"/>
<path d="M420.0 360.0 A250 250 0 0 0 64.3 133.4" class="grid"/>
<text x="412" y="378" class="sml">1.0</text>
<text x="140" y="114" class="sml">1.0</text>
<text x="156" y="378" class="sml">0</text>
<path d="M170 360 L 370.0 210.0" stroke="#3B5BDB" stroke-width="2.4" fill="none" marker-end="url(#g)"/>
<path d="M170 360 L 345.0 185.0" stroke="#0C8599" stroke-width="2.4" fill="none" marker-end="url(#g)"/>
<path d="M170 360 L 120.0 135.0" stroke="#D9480F" stroke-width="2.4" fill="none" marker-end="url(#g)"/>
<path d="M246.0 303.0 A95 95 0 0 0 237.2 292.8" stroke="#0C8599" stroke-width="1.6" fill="none"/>
<path d="M282.0 276.0 A140 140 0 0 0 139.6 223.3" stroke="#D9480F" stroke-width="1.6" fill="none"/>
<text x="260" y="298" class="lbl cg">8°</text>
<text x="224" y="214" class="lbl co" text-anchor="middle">66°</text>
<text x="382" y="226" class="lbl cb" text-anchor="start">고양이 (0.8, 0.6)</text>
<text x="337" y="175" class="lbl cg" text-anchor="end">강아지 (0.7, 0.7)</text>
<text x="112" y="125" class="lbl co" text-anchor="end">자동차 (-0.2, 0.9)</text>
<text x="520" y="90" class="sec">계산</text>
<text x="520" y="118" class="io mono">cos = (A · B) / (|A| × |B|)</text>
<text x="520" y="160" class="lbl cg">고양이 · 강아지</text>
<text x="520" y="182" class="io mono">0.98 / (1.0 × 0.990) ≈ 0.99</text>
<text x="520" y="200" class="note">각도 8°. 방향이 거의 같음</text>
<text x="520" y="242" class="lbl co">고양이 · 자동차</text>
<text x="520" y="264" class="io mono">0.38 / (1.0 × 0.922) ≈ 0.41</text>
<text x="520" y="282" class="note">각도 66°. 방향이 많이 다름</text>
<text x="520" y="330" class="note">각도가 작을수록 1에 가까움</text>
<text x="520" y="348" class="note">점선은 길이 1. 길이가 달라도 방향만 봄</text>
</svg>
