<svg width="860" viewBox="0 0 900 1000" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  text { fill: #1a1a1a; }
  .sec  { font-size: 13px; font-weight: 600; fill: #52514e; }
  .w    { font-size: 15px; font-weight: 600; }
  .io   { font-size: 12.5px; font-weight: 600; }
  .sml  { font-size: 11px; font-weight: 600; }
  .mono { font-size: 13px; font-family: Consolas, "Courier New", monospace; }
  .val  { font-size: 11.5px; font-weight: 600; }
  .note { font-size: 11.5px; fill: #52514e; }
  .cell { fill: #F8F9FA; stroke: #868E96; stroke-width: 1.8; }
  .ar   { stroke: #898781; stroke-width: 1.8; fill: none; }
  .hh   { stroke: #E64980; stroke-width: 2; fill: none; }
  .ht   { font-size: 12px; font-weight: 600; fill: #E64980; }
  .nh   { fill: #FFF0F6; stroke: #E64980; stroke-width: 1.6; }
  .nx   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .nt   { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.6; }
  .lh   { stroke: #E64980; stroke-width: 1; fill: none; opacity: 0.5; }
  .lx   { stroke: #4C6EF5; stroke-width: 1.2; fill: none; opacity: 0.75; }
  .cx   { fill: #1864AB; } .ch { fill: #C2255C; } .cb { fill: #495057; }
  .t3   { fill: #0CA678; } .p3 { stroke: #0CA678; stroke-width: 3; fill: none; }
  .t2   { fill: #F76707; } .p2 { stroke: #F76707; stroke-width: 3; fill: none; }
  .t1   { fill: #4C6EF5; } .p1 { stroke: #4C6EF5; stroke-width: 3; fill: none; }
  .b3   { fill: #E6FCF5; stroke: #0CA678; stroke-width: 1.6; }
  .b2   { fill: #FFF4E6; stroke: #F76707; stroke-width: 1.6; }
  .b1   { fill: #EEF2FF; stroke: #4C6EF5; stroke-width: 1.6; }
  .dash { stroke: #adb5bd; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
</style>
<title>RNN의 순환 구조와 한 칸 안의 계산, 출력까지 지나는 칸</title>
<desc>첫째로 출력이 자기 입력으로 되돌아오는 접힌 모습과 시간 순서로 펼친 모습, 둘째로 가운데 칸을 열어 units 세 개가 입력 하나와 앞 결과 세 개를 모두 받는 모습, 셋째로 각 입력이 출력까지 지나는 칸 수만큼 순환 가중치가 곱해져 옛날 입력의 영향이 줄거나 커지는 모습을 보여준다.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ══════ 1. 순환 ══════ -->
<text x="152" y="46" text-anchor="middle" class="sec">접힌 모습</text>
<rect x="110" y="100" width="84" height="52" rx="6" class="cell"/>
<text x="152" y="132" text-anchor="middle" class="w">W</text>
<path d="M152 100 V 80" class="ar" marker-end="url(#a)"/>
<text x="152" y="72" text-anchor="middle" class="io">출력</text>
<path d="M152 200 V 158" class="ar" marker-end="url(#a)"/>
<text x="152" y="220" text-anchor="middle" class="io">입력</text>
<path d="M194 112 C 240 104, 240 148, 194 140" class="hh" marker-end="url(#a)"/>
<text x="248" y="126" class="ht">h</text>
<text x="248" y="144" class="note">자기에게</text>
<text x="248" y="160" class="note">되돌아옴</text>

<line x1="296" y1="36" x2="296" y2="236" stroke="#d6d4cf" stroke-width="1"/>

<text x="546" y="46" text-anchor="middle" class="sec">펼친 모습 (시간 순서로)</text>
<text x="546" y="86" text-anchor="middle" class="note">세 칸이 다른 층이 아니라 같은 W 하나를 세 번 다시 쓰는 것</text>
<rect x="340" y="100" width="84" height="52" rx="6" class="cell"/><text x="382" y="132" text-anchor="middle" class="w">W</text>
<rect x="504" y="100" width="84" height="52" rx="6" class="cell"/><text x="546" y="132" text-anchor="middle" class="w">W</text>
<rect x="668" y="100" width="84" height="52" rx="6" class="cell"/><text x="710" y="132" text-anchor="middle" class="w">W</text>
<path d="M424 126 H 500" class="hh" marker-end="url(#a)"/><text x="462" y="116" text-anchor="middle" class="ht">h₁</text>
<path d="M588 126 H 664" class="hh" marker-end="url(#a)"/><text x="626" y="116" text-anchor="middle" class="ht">h₂</text>
<path d="M752 126 H 806" class="ar" marker-end="url(#a)"/><text x="818" y="131" class="io">출력</text>
<path d="M382 200 V 158" class="p1" marker-end="url(#a)"/>
<path d="M546 200 V 158" class="p2" marker-end="url(#a)"/>
<path d="M710 200 V 158" class="p3" marker-end="url(#a)"/>
<text x="382" y="220" text-anchor="middle" class="io t1">나는</text>
<text x="546" y="220" text-anchor="middle" class="io t2">밥을</text>
<text x="710" y="220" text-anchor="middle" class="io t3">먹었다</text>

<text x="40" y="250" class="note">출력이 자기 입력으로 되돌아오는 구조라서 recurrent(순환). 펼친 칸 수가 timesteps이고, h는 앞 칸까지의 내용을 담아 다음 칸으로 넘어감</text>

<line x1="40" y1="270" x2="860" y2="270" stroke="#d6d4cf" stroke-width="1"/>

<!-- ══════ 2. 한 칸 열어 보기 ══════ -->
<rect x="498" y="94" width="96" height="64" rx="8" class="dash"/>
<text x="40" y="296" class="sec">가운데 칸(점선) 하나를 열어 보면   units 3개, feature 1개</text>

<text x="280" y="318" text-anchor="middle" class="sml ch">앞 결과  h₁</text>
<circle cx="280" cy="344" r="12" class="nh"/><text x="280" y="348" text-anchor="middle" class="sml">h11</text>
<circle cx="280" cy="380" r="12" class="nh"/><text x="280" y="384" text-anchor="middle" class="sml">h12</text>
<circle cx="280" cy="416" r="12" class="nh"/><text x="280" y="420" text-anchor="middle" class="sml">h13</text>
<text x="280" y="444" text-anchor="middle" class="sml cx">입력</text>
<circle cx="280" cy="468" r="12" class="nx"/><text x="280" y="472" text-anchor="middle" class="sml">x</text>

<text x="540" y="318" text-anchor="middle" class="sml">이번 결과  h₂</text>
<circle cx="540" cy="344" r="12" class="nt"/><text x="540" y="348" text-anchor="middle" class="sml">h21</text>
<circle cx="540" cy="380" r="12" class="nt"/><text x="540" y="384" text-anchor="middle" class="sml">h22</text>
<circle cx="540" cy="416" r="12" class="nt"/><text x="540" y="420" text-anchor="middle" class="sml">h23</text>

<path d="M292 344 L 526 344 M292 344 L 526 380 M292 344 L 526 416" class="lh"/>
<path d="M292 380 L 526 344 M292 380 L 526 380 M292 380 L 526 416" class="lh"/>
<path d="M292 416 L 526 344 M292 416 L 526 380 M292 416 L 526 416" class="lh"/>
<path d="M290 458 L 526 348 M290 458 L 526 384 M290 458 L 526 420" class="lx"/>

<text x="600" y="346" class="sml ch">순환 가중치</text><text x="600" y="362" class="note">3 × 3 = 9개</text>
<text x="600" y="394" class="sml cx">입력 가중치</text><text x="600" y="410" class="note">1 × 3 = 3개</text>
<text x="600" y="442" class="sml cb">바이어스</text><text x="600" y="458" class="note">units마다 하나 = 3개</text>
<line x1="600" y1="474" x2="790" y2="474" stroke="#b5b2ac" stroke-width="1"/>
<text x="600" y="494" class="sml">합 15개  =  3 × (1 + 3 + 1)</text>

<text x="40" y="500" class="note">h는 숫자 하나가 아니라</text>
<text x="40" y="516" class="note">units 개수만큼의 벡터.</text>
<text x="40" y="532" class="note">모든 입력과 모든 앞 결과가</text>
<text x="40" y="548" class="note">units 하나하나에 전부 들어감</text>

<line x1="40" y1="570" x2="860" y2="570" stroke="#d6d4cf" stroke-width="1"/>

<!-- ══════ 3. 출력까지 지나는 칸 ══════ -->
<text x="40" y="596" class="sec">출력까지 가는 동안 지나는 칸   (위 체인과 가로 위치가 같음)</text>
<text x="816" y="600" class="sml">순환 가중치</text>

<text x="700" y="628" text-anchor="end" class="io t3">먹었다</text>
<path d="M710 624 H 806" class="p3"/><circle cx="710" cy="624" r="5" fill="#0CA678"/>
<text x="816" y="628" class="val t3">0번</text>

<text x="536" y="656" text-anchor="end" class="io t2">밥을</text>
<path d="M546 652 H 806" class="p2"/><circle cx="546" cy="652" r="5" fill="#F76707"/><circle cx="710" cy="652" r="5" fill="#F76707"/>
<text x="816" y="656" class="val t2">1번</text>

<text x="372" y="684" text-anchor="end" class="io t1">나는</text>
<path d="M382 680 H 806" class="p1"/><circle cx="382" cy="680" r="5" fill="#4C6EF5"/><circle cx="546" cy="680" r="5" fill="#4C6EF5"/><circle cx="710" cy="680" r="5" fill="#4C6EF5"/>
<text x="816" y="684" class="val t1">2번</text>

<text x="40" y="714" class="mono">출력 = <tspan class="t3">먹었다·입력가중치</tspan> + <tspan class="t2">밥을·입력가중치·순환가중치</tspan> + <tspan class="t1">나는·입력가중치·순환가중치²</tspan></text>

<line x1="40" y1="744" x2="860" y2="744" stroke="#d6d4cf" stroke-width="1"/>
<text x="40" y="770" class="sec">순환 가중치 크기에 따라 앞 입력의 영향이 달라짐</text>

<text x="60" y="804" class="sec">순환 가중치 = 0.5</text>
<rect x="60"  y="904" width="40" height="8"  class="b1"/>
<rect x="120" y="896" width="40" height="16" class="b2"/>
<rect x="180" y="880" width="40" height="32" class="b3"/>
<text x="80"  y="898" text-anchor="middle" class="val t1">0.25</text>
<text x="140" y="890" text-anchor="middle" class="val t2">0.5</text>
<text x="200" y="874" text-anchor="middle" class="val t3">1.0</text>
<line x1="60" y1="912" x2="220" y2="912" stroke="#b5b2ac" stroke-width="1"/>
<text x="80"  y="930" text-anchor="middle" class="note">나는</text>
<text x="140" y="930" text-anchor="middle" class="note">밥을</text>
<text x="200" y="930" text-anchor="middle" class="note">먹었다</text>
<text x="60"  y="954" class="note">옛날 것일수록 작아짐</text>

<text x="480" y="804" class="sec">순환 가중치 = 1.5</text>
<rect x="480" y="880" width="40" height="32" class="b1"/>
<rect x="540" y="864" width="40" height="48" class="b2"/>
<rect x="600" y="840" width="40" height="72" class="b3"/>
<text x="500" y="874" text-anchor="middle" class="val t1">1.0</text>
<text x="560" y="858" text-anchor="middle" class="val t2">1.5</text>
<text x="620" y="834" text-anchor="middle" class="val t3">2.25</text>
<line x1="480" y1="912" x2="640" y2="912" stroke="#b5b2ac" stroke-width="1"/>
<text x="500" y="930" text-anchor="middle" class="note">나는</text>
<text x="560" y="930" text-anchor="middle" class="note">밥을</text>
<text x="620" y="930" text-anchor="middle" class="note">먹었다</text>
<text x="480" y="954" class="note">옛날 것일수록 커짐</text>

<text x="40" y="982" class="note">timesteps가 30이면 첫 입력은 29칸을 지나므로 순환 가중치가 29번 곱해짐. 0.5²⁹은 0.0000000019, 1.5²⁹은 약 127,000</text>
</svg>
